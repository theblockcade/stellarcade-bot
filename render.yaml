# Render Blueprint — web service (free tier compatible).
#
# Background workers require a paid Render plan. We run the bot as a
# "web" service instead: a minimal health-check HTTP server binds to
# $PORT so Render is satisfied, while the bot itself runs via
# long-polling in the same process.
#
# DATABASE_URL is required for durable wallet links: when set,
# bot.ts uses PostgresLinkStore (writes to the arbiter's bot_links table)
# instead of JsonFileLinkStore, which lives on ephemeral disk and is
# wiped on every redeploy. Point it at the same Postgres instance as
# stellarcade-arbiter-db — bot_links is created by the arbiter's migration.

services:
  - type: web
    name: stellarcade-bot
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: GATEWAY_URL
        # Must include the backend's /api mount prefix — ArcadeApiClient
        # appends paths like /leaderboard directly to this base.
        value: "https://gateway.stellarcade.xyz/api"
      - key: ARBITER_URL
        value: "https://arbiter.stellarcade.xyz"
      - key: WEB_APP_URL
        value: "https://stellarcade.xyz"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
