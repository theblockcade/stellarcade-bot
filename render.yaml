# Render Blueprint — background worker (no HTTP port; the bot connects
# outbound to Telegram/Discord, it doesn't serve requests).
#
# DATABASE_URL below is required for durable wallet links: when it's set,
# bot.ts uses PostgresLinkStore (writes to the arbiter's bot_links table)
# instead of JsonFileLinkStore, which otherwise lives on this service's
# ephemeral disk and is wiped on every redeploy. Point it at the same
# Postgres instance as stellarcade-arbiter-db (see that repo's render.yaml)
# rather than a separate database — bot_links is created by the arbiter's
# migration, not the bot's.

services:
  - type: worker
    name: stellarcade-bot
    runtime: docker
    plan: free
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: GATEWAY_URL
        # Must include the backend's /api mount prefix — ArcadeApiClient
        # appends paths like /leaderboard directly to this base.
        value: "https://gateway.theblockcade.xyz/api"
      - key: ARBITER_URL
        value: "https://arbiter.theblockcade.xyz"
      - key: WEB_APP_URL
        value: "https://theblockcade.xyz"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
